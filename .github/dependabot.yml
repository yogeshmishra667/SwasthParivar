# Dependabot config — automated dependency updates.
#
# Rationale: manual CVE chasing does not scale (commit fc55686 patched
# 11 HIGH-severity CVEs in one sweep — we want a steady drip instead).
#
# Rules:
#   - Weekly cadence; Monday is least disruptive (away from release days).
#   - Major version bumps are ignored — they need human design review.
#   - PRs are grouped per ecosystem so we don't flood with 30 PRs per week.
#   - Reviewer set is the same single owner as CODEOWNERS; the 2-reviewer
#     rule from PULL_REQUEST_TEMPLATE.md takes over once a second owner
#     exists.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: chore
      include: scope
    groups:
      prod-patches:
        applies-to: version-updates
        update-types: [patch]
        dependency-type: production
      dev-minors:
        applies-to: version-updates
        update-types: [minor, patch]
        dependency-type: development
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Majors require human design review (Express 5 → 6, Prisma 7 → 8 etc.)
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # The Expo SDK owns these versions: they move only with an SDK upgrade
      # (`npx expo install --fix`), never piecemeal. CI does not build the
      # native app or run the mobile Jest suite, so a bad bump here passes
      # CI and breaks the device build (react-native-screens 4.16 → 4.25,
      # #47) or every RNTL test (react-test-renderer 19.2 vs react 19.1, #173).
      # React must match react-native's renderer exactly — no updates at all.
      - dependency-name: "react"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "react-test-renderer"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "react-native"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      # Native modules: patch updates are fine, minors need an SDK-aligned build.
      - dependency-name: "react-native-*"
        update-types: [version-update:semver-minor]
      - dependency-name: "@react-native-*/*"
        update-types: [version-update:semver-minor]
      # Except the ones the SDK pins to an exact version
      # (expo/bundledNativeModules.json): CI's `expo install --check` fails on
      # any other version, a patch included (#194: flash-list 2.0.3, skia
      # 2.2.21, worklets 0.5.2). Re-check this list on every SDK upgrade.
      - dependency-name: "@shopify/react-native-skia"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@shopify/flash-list"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "react-native-worklets"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "react-native-svg"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@react-native-community/netinfo"
        update-types: [version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: chore
      include: scope
